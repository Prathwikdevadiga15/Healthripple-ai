[project]
name = "healthripple-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
	"pydantic>=2.8,<3.0",
	"pandas>=2.2,<3.0",
	"numpy>=1.26,<3.0",
	"networkx>=3.3,<4.0",
	"groq>=0.11,<1.0",
	"python-dotenv>=1.0,<2.0",
]

[tool.vercel]
entrypoint = "main.py"

[tool.vercel.scripts]
build = "npm ci --prefix apps/web && npm run build --prefix apps/web"